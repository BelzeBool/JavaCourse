# Проверка курса на каждый push и pull request:
# эталоны проходят тесты, стартовый код ученика — нет (tools/check_starters.py).
name: Проверка задач

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - run: pip install pyyaml
      - run: python3 tools/check_starters.py
