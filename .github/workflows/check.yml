# Проверка курса на каждый push и pull request:
# - эталоны проходят тесты, стартовый код ученика — нет (tools/check_starters.py);
# - шаги не используют понятия из будущих уроков (tools/check_order.py);
# - превью собирается, все картинки на месте (tools/preview.py).
name: Проверка задач

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - run: pip install -r requirements.txt
      - run: python3 tools/check_order.py
      - run: python3 tools/preview.py
      - run: python3 tools/check_starters.py
      - run: ./gradlew :common:test
